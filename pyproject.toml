[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "callarchive"
version = "0.1.0"
description = "可自托管的通话录音转写与归档工作台，支持仟客、北森和飞书"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "Jinja2>=3.1,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.20,<1",
    "soundfile>=0.13,<1",
    "uvicorn>=0.30,<1",
    "tzdata>=2024.1",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["numpy>=1.26,<3"]
nano = [
    "funasr==1.4.26",
    "modelscope",
    "scikit-learn>=1.3",
    "sherpa-onnx==2.0.1",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "umap-learn",
]

[tool.setuptools.package-data]
"callarchive.backend" = ["templates/*.html", "static/*.css", "static/*.js"]
