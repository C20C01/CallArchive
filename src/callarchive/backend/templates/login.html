{% extends "base.html" %}
{% block title %}登录 · CallArchive{% endblock %}
{% block layout %}narrow{% endblock %}
{% block content %}
  <form class="panel form" action="/workbench/login" method="post" aria-labelledby="sign-in">
    <h1 id="sign-in">登录工作台</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="credential">访问凭据</label>
    <input id="credential" name="credential" type="password" autocomplete="current-password" required maxlength="{{ 256 if password_login else 1024 }}">
    <button type="submit">登录</button>
  </form>
{% endblock %}
