<style nonce="{{ nonce }}">
.cc-heart { display:inline; color:#d94b5b; }
    #cc-signature { position:fixed; left:50%; bottom:16vh; transform:translateX(-50%);
      z-index:49; pointer-events:none; text-align:center; white-space:nowrap; width:max-content; max-width:calc(100vw - 24px); display:block;
      color:var(--muted); opacity:.65; font-size:clamp(11px, 2vw, 14px); letter-spacing:.04em; }
    #cc-signature:not([hidden]) { animation:cc-reveal 3.2s ease both; }
    @keyframes cc-reveal {
      0%,100% { opacity:0; }
      18%,78% { opacity:.65; }
    }
    @media(prefers-reduced-motion:reduce) {
      #cc-signature:not([hidden]) { animation:none; }
    }
    #cc-party { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50; }

#cc-signature[hidden], #cc-party[hidden] { display: none; }

.console-header h1 { user-select:none; }
</style>
  <footer id="cc-signature" role="status" hidden>Made with <span class="cc-heart">❤</span> by CC2001 &amp; Codex</footer>
  <canvas id="cc-party" aria-hidden="true" hidden></canvas>
<script nonce="{{ nonce }}">
    {
      // Made with ❤ by CC2001 & Codex
      const title = document.querySelector('.console-header h1');
      const signature = document.getElementById('cc-signature');
      const canvas = document.getElementById('cc-party');
      let frame, signatureTimer, celebrating = false;
      function celebrate() {
        if (celebrating) return;
        celebrating = true;
        signature.hidden = false;
        clearTimeout(signatureTimer);
        signatureTimer = setTimeout(() => { signature.hidden = true; }, 3200);
        cancelAnimationFrame(frame);
        canvas.hidden = true;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          signature.hidden = false;
          signatureTimer = setTimeout(() => { signature.hidden = true; celebrating = false; }, 3200);
          return;
        }
        const context = canvas.getContext('2d');
        if (!context) return;
        const width = window.innerWidth, height = window.innerHeight;
        const ratio = 1;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        context.scale(ratio, ratio);
        canvas.hidden = false;
        const colors = ['#f5222d', '#ffb800', '#1677ff', '#a020f0', '#00b85b'];
        const particles = [];
        for (let i = 0; i < 500; i++) {
          const right = i % 2;
          const angle = -Math.PI/2 + .18 + Math.random()*1.08;
          const speed = 14 + (Math.random()+Math.random()+Math.random())*6;
          const spread = Math.random()*Math.PI*2;
          const radius = Math.random()*6;
          particles.push({
            x:(right ? width+40 : -40)+Math.cos(spread)*radius, y:height*.92+Math.sin(spread)*radius,
            vx:(right ? -1 : 1)*Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
            color:colors[i % colors.length], angle:Math.random()*Math.PI*2,
            spin:(Math.random()-.5)*.16, size:3+(Math.random()+Math.random())*3,
            phase:Math.random()*Math.PI*2, delay:Math.random()*350, paper:true
          });
        }
        const signatureBounds = signature.getBoundingClientRect();
        const began = performance.now();
        let previous = began;
        function draw(now) {
          const elapsed = now - began;
          const step = Math.min((now - previous) / 16.67, 2);
          previous = now;
          context.clearRect(0, 0, width, height);
          for (const particle of particles) {
            if (particle.delay > elapsed) continue;
                        const nearSignature = particle.x > signatureBounds.left-12 && particle.x < signatureBounds.right+12
              && particle.y > signatureBounds.top-16 && particle.y < signatureBounds.bottom+12;
            const drag = nearSignature ? .82 : 1;
            if (nearSignature) {
              particle.x += Math.sin(particle.phase)*.6*step;
              particle.angle += .025*step;
            }
            particle.x += (particle.vx + Math.sin(elapsed/1800+particle.phase)*.45) * step * drag;
            particle.y += particle.vy * step * drag;
            particle.vy += .34*step;
            context.save();
            context.globalAlpha = 1;
            context.fillStyle = particle.color;
            context.globalAlpha *= 1;
            context.translate(particle.x, particle.y);
            if (particle.paper) {
              particle.angle += particle.spin * step;
              context.rotate(particle.angle);
              context.fillRect(-particle.size/2, -particle.size/2, particle.size,
                particle.size*.7*(.45+.55*Math.abs(Math.cos(particle.angle))));
            } else {
              context.beginPath();
              context.arc(0, 0, particle.size, 0, Math.PI*2);
              context.fill();
            }
            context.restore();
          }
          const stillVisible = particles.some(particle => particle.delay > elapsed
            || particle.y < height+particle.size*2 || particle.vy < 0);
          if (stillVisible && elapsed < 15000) frame = requestAnimationFrame(draw);
          else { canvas.hidden = true; celebrating = false; context.clearRect(0, 0, width, height); }
        }
        frame = requestAnimationFrame(draw);
      }
      let clicks = 0, lastClick = 0;
      title.addEventListener('click', () => {
        const now = Date.now();
        clicks = now-lastClick < 1200 ? clicks+1 : 1;
        lastClick = now;
        if (clicks === 4) { clicks = 0; celebrate(); }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { cancelAnimationFrame(frame); canvas.hidden = true; signature.hidden = true; celebrating = false; }
      });
    }
</script>
